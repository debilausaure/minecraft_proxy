[package]
name = "minecraft_proxy"
version = "1.0.0"
authors = ["debilausaure", "irevoire"]
edition = "2021"

[dependencies]
clap = { version = "4.5.18", features = ["derive"] }
env_logger = { version = "0.11.5", features = ["unstable-kv"] }
http-body-util = "0.1.2"
hyper = { version = "1.4.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.8", features = ["tokio"] }
log = { version = "0.4.22", features = ["kv_std"] }
log-panics = "2.1.0"
mc_server_list_ping = { git = "https://github.com/debilausaure/mc_server_list_ping" }
tokio = { version = "1.40.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true